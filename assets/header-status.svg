<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 68" width="100%" height="68">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0414" />
      <stop offset="50%" stop-color="#140926" />
      <stop offset="100%" stop-color="#1f0d38" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3399" />
      <stop offset="50%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#bd93f9" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7bf1a8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(68px); }
      }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .pulse-dot { animation: blink 1.6s infinite ease-in-out; }
      .badge-glow { filter: drop-shadow(0 0 4px rgba(255, 51, 153, 0.45)); }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="836" height="64" rx="14" fill="url(#bgGrad)" stroke="#ff5ea8" stroke-width="1.5" stroke-opacity="0.75" />
  <rect x="4" y="4" width="832" height="60" rx="12" fill="none" stroke="#bd93f9" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="6,4" />

  <!-- CRT Corner Highlights -->
  <path d="M 12 6 L 6 6 L 6 12" stroke="#00f5d4" stroke-width="2" fill="none" />
  <path d="M 828 6 L 834 6 L 834 12" stroke="#ff79c6" stroke-width="2" fill="none" />
  <path d="M 6 56 L 6 62 L 12 62" stroke="#ff79c6" stroke-width="2" fill="none" />
  <path d="M 834 56 L 834 62 L 828 62" stroke="#00f5d4" stroke-width="2" fill="none" />

  <!-- Left: Cute Void Mascot Icon -->
  <g transform="translate(24, 18)">
    <!-- Little dripping black ink ball -->
    <ellipse cx="16" cy="16" rx="14" ry="13" fill="#0d0418" stroke="#ff5ea8" stroke-width="1.5" />
    <!-- horns/ears -->
    <path d="M 4 8 Q 1 1 7 5" stroke="#ff5ea8" stroke-width="1.5" fill="#0d0418" />
    <path d="M 28 8 Q 31 1 25 5" stroke="#ff5ea8" stroke-width="1.5" fill="#0d0418" />
    <!-- dripping drop -->
    <path d="M 14 28 C 14 32, 18 32, 18 28 Z" fill="#ff5ea8" />
    <!-- x_x eyes -->
    <path d="M 8 13 L 13 18 M 13 13 L 8 18" stroke="#ff79c6" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 19 13 L 24 18 M 24 13 L 19 18" stroke="#ff79c6" stroke-width="1.6" stroke-linecap="round" />
    <!-- cute blush -->
    <ellipse cx="6" cy="19" rx="2.5" ry="1.2" fill="#ff3399" opacity="0.8" />
    <ellipse cx="26" cy="19" rx="2.5" ry="1.2" fill="#ff3399" opacity="0.8" />
  </g>

  <!-- Title & Host info -->
  <text x="68" y="32" class="font-mono badge-glow" fill="#ff79c6" font-size="13" font-weight="700" letter-spacing="1.5">
    HOST: HOUJOU.CORE <tspan fill="#64748b" font-weight="400">::</tspan> <tspan fill="#00f5d4">KERNEL: CUTE_CHAOS_2.0</tspan>
  </text>
  <text x="68" y="49" class="font-mono" fill="#e2e8f0" font-size="11" opacity="0.75" letter-spacing="0.5">
    [ STATUS: <tspan fill="#38ef7d" font-weight="bold">ONLINE</tspan> ] ✦ MOOD: <tspan fill="#ffe66d">KAWAII-WEIRDCORE</tspan> ✦ INTENTIONAL: <tspan fill="#ff79c6">YES たぶん</tspan>
  </text>

  <!-- Status Light Right -->
  <g transform="translate(670, 22)">
    <rect x="0" y="0" width="144" height="24" rx="12" fill="#0c0418" stroke="#00f5d4" stroke-width="1" opacity="0.85" />
    <circle cx="14" cy="12" r="4.5" fill="#00f5d4" class="pulse-dot" />
    <circle cx="14" cy="12" r="7" fill="none" stroke="#00f5d4" stroke-width="1" opacity="0.4" class="pulse-dot" />
    <text x="27" y="16" class="font-mono" fill="#00f5d4" font-size="10" font-weight="700" letter-spacing="1">DREAM_ACTIVE 🍓</text>
  </g>
</svg>

