<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 34" width="100%" height="34">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3399" stop-opacity="0" />
      <stop offset="15%" stop-color="#ff3399" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="1" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="85%" stop-color="#ff3399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff3399" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Main Glow Line -->
  <line x1="20" y1="17" x2="820" y2="17" stroke="url(#divGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Drips & Dots -->
  <circle cx="420" cy="17" r="4.5" fill="#00f5d4" />
  <circle cx="420" cy="17" r="8" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.5" />
  <!-- Drip down center -->
  <path d="M 420 20 C 418 26, 422 28, 420 31" stroke="#ff3399" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <circle cx="420" cy="32" r="1.5" fill="#ff79c6" />

  <!-- Accent stars & shapes left -->
  <path d="M 330 17 L 333 13 L 336 17 L 333 21 Z" fill="#ff79c6" />
  <circle cx="240" cy="17" r="2.5" fill="#a855f7" />
  <circle cx="248" cy="17" r="1.5" fill="#ff3399" />
  <path d="M 150 17 Q 152 14 154 17 Q 152 20 150 17" fill="#00f5d4" />

  <!-- Accent stars & shapes right -->
  <path d="M 510 17 L 513 13 L 516 17 L 513 21 Z" fill="#ff79c6" />
  <circle cx="600" cy="17" r="2.5" fill="#a855f7" />
  <circle cx="592" cy="17" r="1.5" fill="#ff3399" />
  <path d="M 690 17 Q 688 14 686 17 Q 688 20 690 17" fill="#00f5d4" />

  <!-- Tiny Strawberry silhouette at center-left -->
  <g transform="translate(382, 11) scale(0.65)">
    <path d="M 6 4 C 1 6, 2 13, 7 17 C 12 13, 13 6, 8 4 Z" fill="#ff2a6d" />
    <path d="M 4 3 Q 7 0 10 3 Q 7 4 4 3 Z" fill="#00f5d4" />
  </g>

  <!-- Tiny Void eye at center-right -->
  <g transform="translate(446, 11) scale(0.65)">
    <circle cx="8" cy="10" r="7" fill="#0d0418" stroke="#ff5ea8" stroke-width="1.2" />
    <!-- x_x -->
    <path d="M 4 8 L 7 11 M 7 8 L 4 11" stroke="#ff79c6" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 9 8 L 12 11 M 12 8 L 9 11" stroke="#ff79c6" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>

